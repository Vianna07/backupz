name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0-dev.3013+abd131e33

      - name: Format check
        run: zig fmt --check src/ build.zig build.zig.zon

      - name: Check
        run: zig build check

      - name: Test
        run: zig build test

  cross-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-windows
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0-dev.3013+abd131e33

      - name: Build (${{ matrix.target }})
        run: zig build --release=safe -Dtarget=${{ matrix.target }}